<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AS">
  <defs>
    <!-- 底色：与地面站 UI 的 panel / bg 同源，贴到界面里不会有色差 -->
    <linearGradient id="asBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20262e"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <!-- 笔画：accent 蓝，左上略亮做出一点体积 -->
    <linearGradient id="asFg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fbaff"/>
      <stop offset="1" stop-color="#3f8ff0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#asBg)"/>
  <!-- 一圈极淡的高光，避免纯色块显得平 -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <g stroke="url(#asFg)" stroke-width="5.4" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <!-- A：一笔折线（左腿 → 顶点 → 右腿），横杠独立一段 -->
    <path d="M11 49 L21 15 L31 49"/>
    <path d="M14.9 38.6 L27.1 38.6"/>

    <!-- S：上弧 → 中过渡 → 下弧，与 A 等高、等视觉重量 -->
    <path d="M53 21.5
             C53 17 49.5 13.5 44.75 13.5
             C40 13.5 36.5 17 36.5 21.5
             C36.5 26.5 40 29.5 44.75 31.5
             C49.5 33.5 53 36.5 53 41.5
             C53 46 49.5 49.5 44.5 49.5
             C40 49.5 36.5 46 36.5 41.5"/>
  </g>
</svg>
