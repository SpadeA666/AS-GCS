<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 背景：左上到右下的深色渐变，比纯色更有体积感 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d242e"/>
      <stop offset="100%" stop-color="#0c0f14"/>
    </linearGradient>

    <!-- 字母：青蓝渐变，模拟屏幕/数据的光感 -->
    <linearGradient id="fg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#8ad6ff"/>
      <stop offset="55%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#2a6fd6"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="27" fill="url(#bg)"/>
  <rect x="7" y="7" width="114" height="114" rx="21"
        fill="none" stroke="#303a45" stroke-width="1.4"/>

  <!-- A：三角 + 横杠 -->
  <g filter="url(#glow)" fill="none" stroke="url(#fg)"
     stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 92 L41 38 L58 92"/>
    <path d="M31 72 L51 72"/>
    <!-- S：两段反向弧，收笔略内钩 -->
    <path d="M101 53 C101 44 91 39 83 43 C74 47 75 56 85 61 C95 66 97 73 89 80 C81 87 70 82 69 73"/>
  </g>

  <!-- 点睛：右下角一个橙色小点，呼应航点 -->
  <circle cx="104" cy="99" r="4.5" fill="#e0a030"/>
</svg>
