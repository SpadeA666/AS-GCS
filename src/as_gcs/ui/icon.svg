<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="AS">
  <defs>
    <!-- 底色：与地面站 UI 的 panel / bg 同源 -->
    <linearGradient id="asBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20262e"/>
      <stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <!-- 笔画：accent 蓝，左上略亮 -->
    <linearGradient id="asFg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fbaff"/>
      <stop offset="1" stop-color="#3f8ff0"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#asBg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="28.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <g stroke="url(#asFg)" stroke-width="10.8" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <!-- A -->
    <path d="M22 98 L42 30 L62 98"/>
    <path d="M29.8 77.2 L54.2 77.2"/>
    <!-- S -->
    <path d="M106 43
             C106 34 99 27 89.5 27
             C80 27 73 34 73 43
             C73 53 80 59 89.5 63
             C99 67 106 73 106 83
             C106 92 99 99 89 99
             C80 99 73 92 73 83"/>
  </g>
</svg>
